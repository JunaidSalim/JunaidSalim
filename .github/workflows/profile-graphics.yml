name: Refresh profile graphics

on:
  push:
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-graphics.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Render public activity graphics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Commit updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity*.svg assets/code-mix*.svg assets/profile-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public GitHub activity graphics'
          git push
